version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: interesthub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: interesthub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: interesthub-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
      - PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interesthub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/interesthub
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=interesthub_docker_secret_jwt_key_2026
    depends_on:
      - mongodb
      - redis
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interesthub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
